name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Valeurs factices : suffisantes pour `prisma generate` (schéma seulement,
  # aucune connexion réelle requise) et pour satisfaire le fail-fast sur les
  # secrets JWT au chargement des modules (src/lib/auth.ts, src/middleware.ts).
  DATABASE_URL: "mongodb+srv://ci:ci@ci.local/ci"
  JWT_SECRET: "ci-jwt-secret"
  JWT_REFRESH_SECRET: "ci-jwt-refresh-secret"
  CLOUDINARY_URL: "cloudinary://ci:ci@ci"
  GEMINI_API_KEY: "ci-gemini-key"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Lint (non-blocking — dette technique préexistante à traiter séparément)
        run: npm run lint
        continue-on-error: true
