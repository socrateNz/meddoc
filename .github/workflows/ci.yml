name: CI et déploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Valeurs factices : suffisantes pour `prisma generate` (schéma seulement,
  # aucune connexion réelle requise) et pour satisfaire le fail-fast sur les
  # secrets JWT au chargement des modules (src/lib/auth.ts, src/middleware.ts).
  DATABASE_URL: "mongodb+srv://ci:ci@ci.local/ci"
  JWT_SECRET: "ci-jwt-secret"
  JWT_REFRESH_SECRET: "ci-jwt-refresh-secret"
  CLOUDINARY_URL: "cloudinary://ci:ci@ci"
  GEMINI_API_KEY: "ci-gemini-key"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mêmes versions que sur le VPS de production (pnpm 10.18.3, Node 24) :
      # on teste exactement ce qui sera déployé.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Lint (non-blocking — dette technique préexistante à traiter séparément)
        run: pnpm lint
        continue-on-error: true

  # Déploiement sur le VPS, uniquement pour un push sur main et seulement si le job `ci` a réussi.
  # La clé SSH confiée à GitHub ne peut rien faire d'autre que lancer le script de déploiement du
  # serveur (commande forcée dans ~/.ssh/authorized_keys) ; on lui transmet le commit testé ici.
  deployer:
    name: Déploiement sur le VPS
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    steps:
      - name: Déployer le commit testé
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Empreintes (publiques, sans risque) pour vérifier les secrets sans les révéler.
          echo "Clé de déploiement : $(ssh-keygen -lf ~/.ssh/deploiement 2>&1)"
          echo "Identité du serveur attendue : $(ssh-keygen -lf ~/.ssh/known_hosts 2>&1)"
          # Retire les espaces et retours à la ligne collés par erreur avec l'adresse du serveur.
          HOTE=$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')
          ssh -i ~/.ssh/deploiement -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "etarcosdev@${HOTE}" "${GITHUB_SHA}"
